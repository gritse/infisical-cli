# Follows upstream releases: rebases the fix branch onto the newest upstream tag, tests, and
# publishes ghcr.io/<owner>/infisical-cli:<version>-gritse.N (linux amd64+arm64) plus a GitHub
# release with the macOS arm64 binary. Runs on a schedule from this (default) branch so the fix
# branch itself stays free of fork-only files.
name: Release

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Upstream tag to rebase onto (empty = latest upstream release)"
        required: false
        default: ""
      force:
        description: "Publish a new -gritse.N even if this upstream version already has one"
        type: boolean
        default: false

permissions:
  contents: write
  packages: write
  issues: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  UPSTREAM: Infisical/cli
  FIX_BRANCH: gritse-forked
  SUFFIX: gritse

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Pick the upstream release and the fork version
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.upstream_tag }}
          FORCE: ${{ inputs.force }}
        run: |
          set -eu
          tag="$INPUT_TAG"
          [ -n "$tag" ] || tag=$(gh api "repos/$UPSTREAM/releases/latest" --jq .tag_name)
          version="${tag#v}"
          last=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v$version-$SUFFIX." \
            --jq '.[].ref' | sed "s#.*-$SUFFIX\.##" | sort -n | tail -1)
          if [ -n "$last" ] && [ "$FORCE" != "true" ]; then
            echo "v$version-$SUFFIX.$last already published; nothing to do" >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          n=$(( ${last:-0} + 1 ))
          {
            echo "skip=false"
            echo "upstream_tag=$tag"
            echo "version=$version-$SUFFIX.$n"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing v$version-$SUFFIX.$n on top of $tag" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v4
        if: steps.pick.outputs.skip == 'false'
        with:
          path: ci

      # The rebase brings in upstream's .github/workflows changes, which GITHUB_TOKEN may not push;
      # a write deploy key (secret RELEASE_SSH_KEY) is not subject to that restriction.
      - uses: actions/checkout@v4
        if: steps.pick.outputs.skip == 'false'
        with:
          ref: ${{ env.FIX_BRANCH }}
          fetch-depth: 0
          path: src
          ssh-key: ${{ secrets.RELEASE_SSH_KEY }}

      - name: Rebase the fix branch onto the upstream tag
        if: steps.pick.outputs.skip == 'false'
        id: rebase
        working-directory: src
        env:
          TAG: ${{ steps.pick.outputs.upstream_tag }}
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "before=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git remote add upstream "https://github.com/$UPSTREAM.git"
          git fetch --no-tags upstream "refs/tags/$TAG:refs/tags/$TAG"
          if ! git rebase "$TAG"; then
            {
              echo "### Rebase onto $TAG failed"
              echo '```'
              git status --short | grep '^\(UU\|AA\|DU\|UD\)' || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            git rebase --abort
            exit 1
          fi
          git log --oneline "$TAG..HEAD" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-go@v5
        if: steps.pick.outputs.skip == 'false'
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - name: Build and test
        if: steps.pick.outputs.skip == 'false'
        working-directory: src
        run: |
          set -eu
          go build ./...
          # TestNoDirectRestyConstruction fails on pristine upstream (it flags upstream's own
          # gateway-v2 code) and is not part of upstream's CI, so it is skipped here.
          go test -skip TestNoDirectRestyConstruction ./packages/pam/... ./packages/util/... ./packages/cmd/...

      - name: Build release binaries
        if: steps.pick.outputs.skip == 'false'
        working-directory: src
        env:
          CGO_ENABLED: "0"
          VERSION: ${{ steps.pick.outputs.version }}
        run: |
          set -eu
          ldflags="-s -w -X github.com/Infisical/infisical-merge/packages/util.CLI_VERSION=$VERSION"
          for target in linux/amd64 linux/arm64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            mkdir -p "dist/$os-$arch"
            GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "$ldflags" -o "dist/$os-$arch/infisical" .
          done
          cp ../ci/docker/alpine-multiarch dist/Dockerfile
          cp dist/darwin-arm64/infisical "dist/infisical-$VERSION-darwin-arm64"

      - name: Push the rebased branch and the tag
        if: steps.pick.outputs.skip == 'false'
        working-directory: src
        env:
          VERSION: ${{ steps.pick.outputs.version }}
          TAG: ${{ steps.pick.outputs.upstream_tag }}
          BEFORE: ${{ steps.rebase.outputs.before }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eu
          git push --force-with-lease="refs/heads/$FIX_BRANCH:$BEFORE" origin "HEAD:refs/heads/$FIX_BRANCH"
          git tag -a "v$VERSION" -m "$VERSION: fix branch rebased onto upstream $TAG"
          # The tag goes over the built-in token on purpose: pushes made with it start no other
          # workflows, so upstream's release workflow in this fork stays quiet.
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/v$VERSION"

      - uses: docker/setup-qemu-action@v3
        if: steps.pick.outputs.skip == 'false'
      - uses: docker/setup-buildx-action@v3
        if: steps.pick.outputs.skip == 'false'
      - uses: docker/login-action@v3
        if: steps.pick.outputs.skip == 'false'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        if: steps.pick.outputs.skip == 'false'
        with:
          context: src/dist
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/infisical-cli:${{ steps.pick.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/infisical-cli:latest

      - name: Create the GitHub release
        if: steps.pick.outputs.skip == 'false'
        working-directory: src
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.pick.outputs.version }}
          TAG: ${{ steps.pick.outputs.upstream_tag }}
        run: |
          set -eu
          notes="Fork build on top of upstream [$TAG](https://github.com/$UPSTREAM/releases/tag/$TAG).

          Image: \`ghcr.io/${GITHUB_REPOSITORY_OWNER}/infisical-cli:$VERSION\` (linux/amd64, linux/arm64).

          Fix commits:
          $(git log --format='- %s' "$TAG..HEAD")"
          # -R is required: the checkout also has an "upstream" remote, which gh would prefer.
          gh release create "v$VERSION" "dist/infisical-$VERSION-darwin-arm64" -R "$GITHUB_REPOSITORY" --title "$VERSION" --notes "$notes"

      - name: Close an earlier failure issue
        if: steps.pick.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.pick.outputs.upstream_tag }}
          VERSION: ${{ steps.pick.outputs.version }}
        run: |
          title="Automatic release on top of $TAG failed"
          for n in $(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --json number --jq '.[].number'); do
            gh issue close "$n" -R "$GITHUB_REPOSITORY" --comment "Released as v$VERSION: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/v$VERSION"
          done

      - name: Report a failure as an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.pick.outputs.upstream_tag }}
        run: |
          title="Automatic release on top of ${TAG:-the latest upstream release} failed"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          existing=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" -R "$GITHUB_REPOSITORY" --body "Failed again: $run_url"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body "The Release workflow could not rebase, test or publish the fix branch. Run: $run_url

          Rebase by hand: \`git rebase $TAG\` on \`$FIX_BRANCH\`, push, then dispatch the Release workflow with force enabled."
          fi
